name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا المتوافقة (ضرورية للـ Kotlin والـ Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعطاء صلاحيات التشغيل لملف Gradlew عبر مساره المباشر داخل مجلد android
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # 4. بناء ملف APK مباشرة باستخدام Gradle
      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      # 5. رفع ملف APK الناتج لتتمكن من تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
